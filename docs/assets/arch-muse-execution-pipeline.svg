<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>ContextPane · Meta Muse model execution order</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b1"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6cb4ff"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b15a"/></marker>
    <style>
      .t{fill:#e8eaee;font-size:14px;font-weight:600}
      .s{fill:#9aa3b1;font-size:12px}
      .m{fill:#9aa3b1;font-size:11.5px;font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace}
      .lbl{fill:#808a9a;font-size:11px;letter-spacing:1.2px;font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace}
      .box{fill:#15181d;stroke:#2a303a;stroke-width:1.5}
      .chip{font-size:11px;font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="860" fill="#0e1013"/>
  <text x="32" y="44" fill="#e8eaee" font-size="21" font-weight="650">Meta Muse models in execution order</text>
  <text x="32" y="68" class="s">One unscripted ticket, end to end. Model ids are the configured ids; the badge shows what actually answers when an id is not served.</text>

  <!-- Stage 0 -->
  <text x="32" y="112" class="lbl">STAGE 0 · BEFORE THE OPERATOR ASKS</text>
  <rect x="32" y="122" width="560" height="104" rx="10" class="box" stroke="#58d39a"/>
  <rect x="48" y="138" width="150" height="22" rx="11" fill="#58d39a" fill-opacity=".14" stroke="#58d39a"/><text x="123" y="153" text-anchor="middle" class="chip" fill="#58d39a">muse-glimmer-30b</text>
  <text x="212" y="154" class="t">Tier 1A hover diagnostics</text>
  <text x="48" y="182" class="s">Open weights on Modal L40S (llama.cpp). Output constrained by a JSON-schema grammar.</text>
  <text x="48" y="201" class="s">Warmed for every pill at start-up, persisted; hover-intent pre-fetch after a 60 ms dwell.</text>
  <text x="48" y="218" class="m">tiers/tier1-hover.ts · router/glimmer-payload.ts · fallback → muse-spark-1.3</text>

  <rect x="616" y="122" width="552" height="104" rx="10" class="box"/>
  <text x="632" y="146" class="lbl">ON DEMAND, ANY TIME</text>
  <text x="632" y="170" class="m"><tspan fill="#6cb4ff">muse-spark-1.3</tspan>  Tier 1B/2 correlate → hydrate_contextpane_layout</text>
  <text x="632" y="190" class="m"><tspan fill="#b69cff">muse-wonder-1.0</tspan> selection lens · POST /api/explore-selection</text>
  <text x="632" y="210" class="m"><tspan fill="#f2b15a">muse-voice-transcribe-1.0</tspan> voice steer · /asr/transcribe</text>

  <!-- Stage 1 -->
  <text x="32" y="268" class="lbl">STAGES 1–5 · SUB-AGENT PIPELINE · POST /api/tickets/triage-custom · local/subagent-orchestrator.ts</text>
  <rect x="32" y="280" width="250" height="132" rx="10" class="box" stroke="#b69cff"/>
  <text x="48" y="304" class="t">1 · Goal Clarifier</text>
  <rect x="48" y="314" width="132" height="22" rx="11" fill="#b69cff" fill-opacity=".14" stroke="#b69cff"/><text x="114" y="329" text-anchor="middle" class="chip" fill="#b69cff">muse-wonder-1.0</text>
  <text x="48" y="358" class="s">Scoping questions → answers</text>
  <text x="48" y="376" class="s">→ typed SteeringParams v0</text>
  <text x="48" y="398" class="m">awaited first</text>

  <path d="M282 346 L330 346" stroke="#9aa3b1" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="334" y="280" width="520" height="132" rx="12" fill="none" stroke="#2a303a" stroke-dasharray="5 4"/>
  <text x="346" y="298" class="lbl">PROMISE.ALL</text>

  <rect x="346" y="306" width="160" height="96" rx="8" class="box"/>
  <text x="358" y="327" class="t">2 · Telemetry Scout</text>
  <text x="358" y="347" class="m" fill="#58d39a">no model · MCP probe</text>
  <text x="358" y="366" class="s">mcp-msgraph +</text>
  <text x="358" y="383" class="s">cloud-status</text>

  <rect x="516" y="306" width="160" height="96" rx="8" class="box" stroke="#b69cff"/>
  <text x="528" y="327" class="t">3 · UI Architect</text>
  <text x="528" y="347" class="m"><tspan fill="#6cb4ff">spark-1.3</tspan> gatekeeper</text>
  <text x="528" y="365" class="m">→ <tspan fill="#b69cff">wonder-1.0</tspan></text>
  <text x="528" y="384" class="s">N+k card → .tsx</text>

  <rect x="686" y="306" width="160" height="96" rx="8" class="box" stroke="#b69cff"/>
  <text x="698" y="327" class="t">4 · IaC &amp; PS7 Coder</text>
  <text x="698" y="347" class="m">muse-code</text>
  <text x="698" y="365" class="m">served as <tspan fill="#b69cff">wonder-1.0</tspan></text>
  <text x="698" y="384" class="s">PS7 · Terraform · rollback</text>

  <path d="M854 346 L902 346" stroke="#9aa3b1" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="906" y="280" width="262" height="132" rx="10" class="box"/>
  <text x="922" y="304" class="t">5 · Safety Verifier</text>
  <text x="922" y="326" class="m" fill="#58d39a">no model · static precheck</text>
  <text x="922" y="350" class="s">Braces, ShouldProcess guard,</text>
  <text x="922" y="368" class="s">wildcards; may auto-wrap.</text>
  <text x="922" y="398" class="m">syntaxHeuristicPrecheck</text>

  <!-- Steering -->
  <rect x="32" y="440" width="1136" height="62" rx="10" fill="#6cb4ff" fill-opacity=".06" stroke="#6cb4ff"/>
  <text x="48" y="466" class="t" fill="#6cb4ff">Two-way steering</text>
  <text x="190" y="466" class="s">scope chip · lens row click · typed answer → PATCH /api/tickets/:id/steer → applySteeringDelta (version++)</text>
  <text x="190" y="487" class="s">→ the coder re-parameterises the staged script (diff shown in the rail) → pre-flight re-runs.  local/steering.ts · packages/catalog/src/steering.ts</text>
  <path d="M766 440 L766 406" stroke="#6cb4ff" stroke-width="1.6" marker-end="url(#as)"/>

  <!-- Tier 3 -->
  <text x="32" y="544" class="lbl">TIER 3 · STAGING AND APPROVAL · tiers/tier3-remediate.ts</text>
  <rect x="32" y="556" width="300" height="140" rx="10" class="box" stroke="#58d39a"/>
  <text x="48" y="580" class="t">Sandbox pre-flight</text>
  <text x="48" y="601" class="m" fill="#58d39a">Modal warm container (cpu)</text>
  <text x="48" y="624" class="s">pwsh AST parse + cmdlet allow-list</text>
  <text x="48" y="643" class="s">terraform fmt -check · validate</text>
  <text x="48" y="662" class="s">falls back to local pwsh</text>
  <text x="48" y="684" class="m">preflight/modal.ts · local.ts</text>

  <path d="M332 610 L404 610" stroke="#f2b15a" stroke-width="1.6" marker-end="url(#aw)"/>
  <rect x="408" y="556" width="270" height="140" rx="10" class="box" stroke="#f2b15a"/>
  <text x="424" y="580" class="t">Write-then-test</text>
  <text x="424" y="601" class="m" fill="#f2b15a">≤ 2 repair turns</text>
  <text x="424" y="624" class="s">Repairable findings go back to</text>
  <text x="424" y="643" class="s">the coder; the verdict is never</text>
  <text x="424" y="662" class="s">forced. Badge: “· N iter”.</text>
  <text x="424" y="684" class="m">tiers/repair-loop.ts</text>
  <path d="M543 556 C543 520 766 530 766 506" stroke="#f2b15a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#aw)"/>
  <text x="560" y="528" class="m" fill="#f2b15a">findings → coder</text>

  <path d="M678 626 L716 626" stroke="#9aa3b1" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="720" y="556" width="200" height="140" rx="10" class="box"/>
  <text x="736" y="580" class="t">Prover (no LLM)</text>
  <text x="736" y="604" class="s">7-bit PCC invariants,</text>
  <text x="736" y="623" class="s">idempotency f(f(S))=f(S),</text>
  <text x="736" y="642" class="s">blast radius, ShouldProcess</text>
  <text x="736" y="684" class="m">formal-verifier.ts</text>

  <path d="M920 626 L958 626" stroke="#9aa3b1" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="962" y="556" width="206" height="140" rx="10" class="box" stroke="#58d39a"/>
  <text x="978" y="580" class="t">Human approve</text>
  <text x="978" y="604" class="s">break-glass live or GitOps PR</text>
  <text x="978" y="623" class="s">snapshot → canary → f⁻¹</text>
  <text x="978" y="642" class="s">inverse built from snapshot</text>
  <text x="978" y="684" class="m">tier3-rollback.ts</text>

  <!-- PII boundary -->
  <rect x="32" y="726" width="1136" height="104" rx="10" fill="#b69cff" fill-opacity=".05" stroke="#b69cff" stroke-dasharray="6 4"/>
  <text x="48" y="752" class="t" fill="#b69cff">Provider boundary · every prompt above passes chatWithForcedTool</text>
  <text x="48" y="775" class="s">vaultMessages swaps UPNs, names, IPs, user and device ids for upn_tok_NN-style pseudonyms; recordPrompt counts any raw PII left;</text>
  <text x="48" y="794" class="s">replies are rehydrated in the orchestrator. Forced tool schemas (Zod → JSON schema) on every call; Meta gets tool_choice "auto" + a nudge.</text>
  <text x="48" y="816" class="m">router/openai.ts · packages/catalog/src/dataplane.ts (PiiVault)</text>
</svg>
