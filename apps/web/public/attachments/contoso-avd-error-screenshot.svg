<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <!-- Synthetic ticket attachment for the ContextPane demo: a Windows App sign-in error. Rendered to the PNG next to it with headless Edge (msedge --headless=new --window-size=1280,800 --screenshot). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3b6e"/>
      <stop offset="0.55" stop-color="#2c5aa0"/>
      <stop offset="1" stop-color="#7aa7d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#wall)"/>
  <rect y="752" width="1280" height="48" fill="#202020" fill-opacity="0.92"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#e8e8e8" font-size="13">
    <rect x="608" y="760" width="32" height="32" rx="4" fill="#3a3a3a"/>
    <rect x="616" y="768" width="7" height="7" fill="#4cc2ff"/><rect x="625" y="768" width="7" height="7" fill="#4cc2ff"/>
    <rect x="616" y="777" width="7" height="7" fill="#4cc2ff"/><rect x="625" y="777" width="7" height="7" fill="#4cc2ff"/>
    <text x="1230" y="773" text-anchor="end">08:04</text>
    <text x="1230" y="790" text-anchor="end">26/10/2026</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="120" width="780" height="530" rx="10" fill="#202020" stroke="#3d3d3d"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="250" y="120" width="780" height="40" rx="10" fill="#2b2b2b"/>
    <rect x="250" y="150" width="780" height="10" fill="#2b2b2b"/>
    <rect x="266" y="131" width="18" height="18" rx="4" fill="#0f6cbd"/>
    <path d="M270 145 l5 -9 l5 9 z" fill="#fff"/>
    <text x="294" y="145" font-size="13" fill="#e6e6e6">Windows App</text>
    <text x="1002" y="146" font-size="16" fill="#bdbdbd">✕</text>

    <circle cx="300" cy="212" r="20" fill="#c42b1c"/>
    <text x="300" y="220" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">!</text>
    <text x="336" y="207" font-size="22" font-weight="600" fill="#ffffff">We couldn't connect to Contoso Finance AVD</text>
    <text x="336" y="232" font-size="14" fill="#c8c8c8">Your sign-in was successful, but access was blocked by a Conditional Access policy.</text>
    <text x="336" y="252" font-size="14" fill="#c8c8c8">Contact your administrator and share the details below.</text>

    <rect x="290" y="276" width="700" height="292" rx="6" fill="#161616" stroke="#3a3a3a"/>
    <g font-size="14">
      <text x="310" y="308" fill="#9e9e9e">Error code</text>
      <text x="470" y="308" fill="#ff99a4" font-family="Cascadia Mono, Consolas, monospace" font-weight="600">AADSTS53003</text>
      <text x="310" y="342" fill="#9e9e9e">Message</text>
      <text x="470" y="342" fill="#e6e6e6">Access has been blocked by Conditional Access policies.</text>
      <text x="310" y="376" fill="#9e9e9e">Correlation ID</text>
      <text x="470" y="376" fill="#e6e6e6" font-family="Cascadia Mono, Consolas, monospace">7f8a9d12-4410-4b9e-9c1a-00155d8a4201</text>
      <text x="310" y="410" fill="#9e9e9e">Timestamp</text>
      <text x="470" y="410" fill="#e6e6e6" font-family="Cascadia Mono, Consolas, monospace">2026-10-26T08:04:10Z</text>
      <text x="310" y="444" fill="#9e9e9e">App ID</text>
      <text x="470" y="444" fill="#e6e6e6" font-family="Cascadia Mono, Consolas, monospace">9cdead84-a844-4324-93f2-b2e6bb768d07</text>
      <text x="310" y="478" fill="#9e9e9e">App name</text>
      <text x="470" y="478" fill="#e6e6e6">Azure Virtual Desktop</text>
      <text x="310" y="512" fill="#9e9e9e">User</text>
      <text x="470" y="512" fill="#e6e6e6" font-family="Cascadia Mono, Consolas, monospace">lynne.robins.contoso@c4a8shili.onmicrosoft.com</text>
      <text x="310" y="546" fill="#9e9e9e">Device</text>
      <text x="470" y="546" fill="#e6e6e6">CONTOSO-LT-0471 · Microsoft Entra joined · Compliant</text>
    </g>

    <rect x="290" y="590" width="150" height="36" rx="5" fill="#2d2d2d" stroke="#454545"/>
    <text x="365" y="613" font-size="14" fill="#e6e6e6" text-anchor="middle">Copy details</text>
    <rect x="840" y="590" width="150" height="36" rx="5" fill="#4cc2ff"/>
    <text x="915" y="613" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">OK</text>
  </g>
</svg>
